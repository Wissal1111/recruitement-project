services:
  user-service:
    build: ./backend/user-service
    container_name: user_service
    restart: always
    ports:
      - "3002:3002"
    env_file:
      - ./backend/user-service/.env
    networks:
      - app-network
    volumes:
      - ./backend/user-service:/app
      - /app/node_modules

  survey-service:
    build: ./backend/survey-service
    container_name: survey_service
    restart: always
    ports:
      - "4000:4000"
    env_file:
      - ./backend/survey-service/.env
    networks:
      - app-network
    volumes:
      - ./backend/survey-service:/app
      - /app/node_modules

  response-service:
    build: ./backend/response-service
    container_name: response_service
    restart: always
    ports:
      - "4003:4003"
    env_file:
      - ./backend/response-service/.env
    networks:
      - app-network
    volumes:
      - ./backend/response-service:/app
      - /app/node_modules

  gateway:
    image: nginx:alpine
    container_name: api_gateway
    restart: always
    ports:
      - "90:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - survey-service
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo_data: