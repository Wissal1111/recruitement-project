events {
    worker_connections 1024;
}

http {
    upstream user-service {
        server user-service:3002;
    }

    upstream survey-service {
        server survey-service:4000;
    }

    upstream recruitment-service {
        server recruitment-service:8083;
    }

    upstream response-service {
        server response-service:4003;
    }

    server {
        listen 80;

        location / {
            return 200 'API Gateway is running. Use /api/ routes to access services.';
            add_header Content-Type text/plain;
        }

        # --- USER SERVICE ---
        location /api/users {
            proxy_pass http://user-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/auth {
            proxy_pass http://user-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/profile {
            proxy_pass http://user-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/roles {
            proxy_pass http://user-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/notifications {
            proxy_pass http://user-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # --- SURVEY SERVICE ---
        location /api/studies {
            proxy_pass http://survey-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/communication {
            proxy_pass http://survey-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # --- RECRUITMENT SERVICE ---
        location /api/recruitment {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Length' 0;
                return 204;
            }
            proxy_pass http://recruitment-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
        }

        location /health {
            return 200 'Gateway is healthy';
            add_header Content-Type text/plain;
        }

        # --- RESPONSE SERVICE ---
        location /api/responses {
            proxy_pass http://response-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }
    }
}