events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=30s;
    resolver_timeout 5s;

    upstream user-service {
        server user-service:3002;
    }

    upstream survey-service {
        server survey-service:4000;
    }

    upstream recruitment-service {
        server recruitment-service:8083;
    }

    upstream response-service {
        server response-service:4003;
    }

    upstream payment-service {
        server payment-service:3050;
    }

    server {
        listen 80;

        location / {
            return 200 'API Gateway is running. Use /api/ routes to access services.';
            add_header Content-Type text/plain;
        }

        # --- USER SERVICE ---
        location /api/users {
            proxy_pass http://user-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/auth {
            proxy_pass http://user-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/profile {
            proxy_pass http://user-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/roles {
            proxy_pass http://user-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/notifications {
            proxy_pass http://user-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # --- SURVEY SERVICE ---
        location /api/studies {
            proxy_pass http://survey-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/communication {
            proxy_pass http://survey-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # --- RECRUITMENT SERVICE ---
        # CORS is handled by Spring Boot SecurityConfig — do not add headers here
        location /api/recruitment {
            proxy_pass http://recruitment-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
        }

        location /health {
            return 200 'Gateway is healthy';
            add_header Content-Type text/plain;
        }

        # --- RESPONSE SERVICE ---
        location /api/responses {
            proxy_pass http://response-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        # --- PAYMENT SERVICE ---
        location /api/payment-cards {
            proxy_pass http://payment-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/wallet {
            proxy_pass http://payment-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/transactions {
            proxy_pass http://payment-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/surveys {
            proxy_pass http://payment-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/rewards {
            proxy_pass http://payment-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }
    }
}