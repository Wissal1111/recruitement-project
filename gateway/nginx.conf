events {
    worker_connections 1024;
}

http {
    upstream user_service {
        server user_service:3001;
    }

    upstream survey_service {
        server survey_service:4000;
    }

    server {
        listen 80;

        # --- USER SERVICE ROUTES ---
        location /api/users {
            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/auth {
            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # --- SURVEY SERVICE ROUTES ---
        location /api/studies {
            proxy_pass http://survey_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/communication {
            proxy_pass http://survey_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Health check
        location /health {
            return 200 'Gateway is healthy';
        }
    }
}
