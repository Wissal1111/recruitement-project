version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: user_service_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: user_service_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  user-service:
    build: .
    container_name: user_service
    restart: always
    ports:
      - "3001:3001"
    env_file:
      - .env
    depends_on:
      - postgres

volumes:
  pgdata: